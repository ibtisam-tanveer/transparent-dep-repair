[project]
name = "transparent-dep-repair"
version = "0.1.0"
description = "AI-Driven Transparent Repair of Software Dependency Configurations (MSc thesis) — Phase 1-5 + Notebook Support + Repo Foundation: run, capture, diagnose, propose/apply/verify, LLM repair, .ipynb support, whole-repo analysis"
requires-python = ">=3.10"
authors = [{ name = "Muhammad Ibtisam Tanveer" }]

dependencies = [
    # Phase 5 only (repair_tool/llm.py). The rest of the tool (runner,
    # diagnose, pypi, venv_manager, repair's rule-based path, apply) stays
    # importable and testable without either of these.
    "openai>=1.0.0",
    "python-dotenv",
    # Notebook Support (repair_tool/notebook.py): the execution *driver*.
    # Runs from this tool's own environment, orchestrating a kernel in the
    # *target's* venv -- see NOTEBOOK_SUPPORT_TASK.md's "where the execution
    # libraries live" split. ipykernel is deliberately NOT listed here: it
    # gets installed into each target venv instead (venv_manager.ensure_ipykernel).
    "nbclient",
    "nbformat",
]

[project.optional-dependencies]
# Not needed to use runner.py itself (stdlib only). Only for exercising
# broken_examples/ during development, see broken_examples/MANIFEST.md.
# ipykernel here is for the dev .venv itself, so a direct run_project()/
# apply_code_edit() call on a notebook (no explicit python_exe, i.e.
# sys.executable) works out of the box in this environment too -- separate
# from venv_manager.ensure_ipykernel(), which covers venvs repair() creates.
dev = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "imageio",
    "pyyaml",
    "ipykernel",
]

[project.scripts]
repair-tool-run = "repair_tool.runner:main"
repair-tool-diagnose = "repair_tool.diagnose:main"
repair-tool-fix = "repair_tool.loop:main"
repair-tool-analyze-repo = "repair_tool.repo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["repair_tool"]
